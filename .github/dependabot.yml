version: 2
updates:
  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/Lingarr.Client"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      # vue-tsc 3.3.x resolves typescript/lib/tsc, which 7.0 no longer exports,
      # so the Test Frontend type-check dies before it starts. Re-enable once
      # vue-tsc supports the 7.1 plugin interface.
      - dependency-name: "typescript"
        versions: ["7.0.x"]
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      npm-major:
        update-types:
          - "major"

  # Backend dependencies
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      nuget-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      nuget-major:
        update-types:
          - "major"
